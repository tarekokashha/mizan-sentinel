name: ci

# The suite is pure Python plus numpy, so it runs anywhere. The matrix exists
# because this project is developed on Windows and two of its defects were
# Windows-specific: a clock epoch mismatch of 5.558460 s between monotonic and
# perf_counter, and GetTickCount64's 15.625 ms resolution against a 33.3 ms
# control period. Dropping Windows would drop the platform those were found on.

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest -q

      - name: Verify the package imports with no vendor SDK present
        run: python -c "import sentinel.kernel, sentinel.shield, sentinel.attacks; print('clean import ok')"
