name: ci

# The suite is pure Python plus numpy, so it runs anywhere. The matrix exists
# because this project is developed on Windows and two of its defects were
# Windows-specific: a clock epoch mismatch of 5.558460 s between monotonic and
# perf_counter, and GetTickCount64's 15.625 ms resolution against a 33.3 ms
# control period. Dropping Windows would drop the platform those were found on.

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest -q

      - name: Verify the package imports with no vendor SDK present
        run: python -c "import sentinel.kernel, sentinel.shield, sentinel.attacks; print('clean import ok')"

      # Deliberately NOT running `python -m sentinel.redteam --quick` here yet.
      # Its exit code currently gates on every declared guard having fired, and
      # a 300-step quick run cannot reach guards whose timescale exceeds it:
      # slow_drift's path budget needs roughly 1474 steps. So the step would be
      # red for a reason that is not a failure. The suite already contains a
      # three-episode red-team smoke run (test_no_attack_escapes_the_envelope),
      # so the runner is exercised on every push regardless. Add this step once
      # the exit code gates on escapes rather than on guard coverage.
